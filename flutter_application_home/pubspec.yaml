name: flutter_application_home
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Discord
      fonts:
        - asset: assets/fonts/ABCGintoDiscord-Regular.ttf
          weight: 400
        - asset: assets/fonts/ABCGintoDiscord-RegularItalic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/ABCGintoDiscord-Medium.ttf
          weight: 500
        - asset: assets/fonts/ABCGintoDiscord-MediumItalic.ttf
          weight: 500
          style: italic